        <!-- Critical CSS for initial load - prevents white screen before React hydrates -->
        <style>
            /* Native splash screen loading indicator */
            .native-splash {
                position: fixed;
                inset: 0;
                background-color: #0f172a;
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 9999;
            }
            .native-splash svg {
                color: #38bdf8;
            }
        </style>

        <!-- Theme color for mobile browsers -->
        <meta name="theme-color" content="#0f172a" />

        <!-- Native splash shown immediately, hidden by React once mounted -->
        <div id="native-splash" class="native-splash">
